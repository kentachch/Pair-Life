default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  # 本番のキャッシュは Solid Cache ではなくメモリ(production.rb の cache_store)を使うので、専用の DB は指定しない
  <<: *default
